name: Update Schedule Daily

on:
  schedule:
    # Запуск каждые 2 часа с 06:00 до 22:00 по МСК (это 03:00-19:00 UTC)
    - cron: '0 3-19/2 * * *'
  workflow_dispatch: # Оставляет кнопку ручного запуска Run workflow
  
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run parser
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python parser.py
        
